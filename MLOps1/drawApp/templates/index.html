<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EMNIST Draw & Predict</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
      }
      #canvas {
        border: 1px solid #000;
        touch-action: none; /* evita scroll en táctil al dibujar */
        image-rendering: pixelated; /* no es vital, pero ayuda al zoom */
      }
      #prediction {
        font-size: 24px;
        margin-top: 10px;
      }
      button {
        margin-top: 10px;
        padding: 8px 16px;
        font-size: 16px;
      }
      #preview {
        image-rendering: pixelated; /* se ve ‘cuadriculado’ al escalar 28→280 */
        border: 1px solid #aaa;
        background: #000;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: start;
        gap: 24px;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Dibuja un carácter</h1>

    <div class="row">
      <div>
        <canvas id="canvas" width="280" height="280"></canvas><br />
        <button id="clear-btn">Limpiar</button>
        <div id="prediction">Predicción: -</div>
      </div>

      <div>
        <div>Entrada final al modelo (28×28 → 280px):</div>
        <img id="preview" width="280" height="280" alt="preview 28x28" />
      </div>
    </div>

    <script src="/static/main.js"></script>
  </body>
</html>
