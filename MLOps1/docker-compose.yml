version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POST_USER}
      POSTGRES_PASSWORD: ${POST_PASS}
      POSTGRES_DB: mlflow # Use this name to avoid errors
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "${POST_PORT}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "5432", "-U", "${POST_USER}"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 10s

  minio: # s3
    image: minio/minio:latest
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    ports:
      - "${MINIO_STORAGE_PORT}:9000"  # S3 API
      - "${MINIO_UI_PORT}:9001"  # Web UI
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 60s
      timeout: 20s
      retries: 3

  mlflow:
    build:
      context: .
      dockerfile: ./Dockerfiles/Dockerfile.mlflow
    container_name: mlflow
    restart: always
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT}
      BACKEND_STORE_URI: postgresql://${POST_USER}:${POST_PASS}@postgres:${POST_PORT}/${POST_DB_MLFLOW}
      ARTIFACT_ROOT: s3://${MLFLOW_BUCKET_NAME}/
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASS}
      MLFLOW_S3_ENDPOINT_URL: http://minio:${MINIO_STORAGE_PORT}
      PREFECT_LOGGING_LEVEL: DEBUG
    depends_on:
      - postgres
      - minio
    ports:
      - "${MLFLOW_PORT}:5000"
    command: >
      mlflow server
        --backend-store-uri postgresql://${POST_USER}:${POST_PASS}@postgres:${POST_PORT}/${POST_DB_MLFLOW}
        --default-artifact-root s3://${MLFLOW_BUCKET_NAME}/
        --host 0.0.0.0
        --port ${MLFLOW_PORT}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://mlflow:${MLFLOW_PORT} || exit 1
      interval: 60s
      timeout: 10s
      retries: 3

  prefect:
    image: prefecthq/prefect:2.14.12-python3.10
    container_name: prefect
    restart: always
    ports:
      - "${PREF_PORT}:4200"
    volumes:
      - ./flows:/app/flows
    working_dir: /app
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POST_USER}:${POST_PASS}@postgres:${POST_PORT}/${POST_DB_PREFECT}
      PREFECT_API_HOST: 0.0.0.0
      PREFECT_API_PORT: ${PREF_PORT}
      PREFECT_API_URL: http://0.0.0.0:${PREF_PORT}/api
    depends_on:
      postgres:
        condition: service_healthy
    command: prefect server start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PREF_PORT}/health"]
      interval: 60s
      timeout: 10s
      retries: 3

  emnist-runner:
    build:
      context: .
      dockerfile: ./Dockerfiles/Dockerfile.emnist-runner
    container_name: emnist-runner
    restart: always
    depends_on:
      mlflow:
        condition: service_healthy
      prefect:
        condition: service_started
    volumes:
      - ./flows:/app/flows
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT}
      MLFLOW_S3_ENDPOINT_URL: http://minio:${MINIO_STORAGE_PORT}
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASS}
      PREFECT_API_URL: http://prefect:4200/api
