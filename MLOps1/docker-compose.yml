services:
  postgres:
    image: postgres:14
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POST_USER}
      POSTGRES_PASSWORD: ${POST_PASS}
      POSTGRES_DB: mlflow # Use this name to avoid errors
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "${POST_PORT}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "5432", "-U", "${POST_USER}"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 3s

  minio: # s3
    image: minio/minio:latest
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    ports:
      - "${MINIO_STORAGE_PORT}:9000" # S3 API
      - "${MINIO_UI_PORT}:9001" # Web UI
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 3s
      
  data-loader:
    image: debian:bullseye
    container_name: data-loader
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    environment:
      MINIO_ENDPOINT: http://minio:${MINIO_STORAGE_PORT}
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASS}
    entrypoint: ["bash", "/scripts/bootstrap.sh"]

  mlflow:
    build:
      context: .
      dockerfile: ./Dockerfiles/Dockerfile.mlflow
    container_name: mlflow
    restart: always
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT}
      BACKEND_STORE_URI: postgresql://${POST_USER}:${POST_PASS}@postgres:${POST_PORT}/${POST_DB_MLFLOW}
      ARTIFACT_ROOT: s3://${MLFLOW_BUCKET_NAME}/
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASS}
      MLFLOW_S3_ENDPOINT_URL: http://minio:${MINIO_STORAGE_PORT}
      PREFECT_LOGGING_LEVEL: DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      data-loader:
        condition: service_completed_successfully
    ports:
      - "${MLFLOW_PORT}:5000"
    command: >
      mlflow server
        --backend-store-uri postgresql://${POST_USER}:${POST_PASS}@postgres:${POST_PORT}/${POST_DB_MLFLOW}
        --default-artifact-root s3://${MLFLOW_BUCKET_NAME}/
        --host 0.0.0.0
        --port ${MLFLOW_PORT}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://mlflow:${MLFLOW_PORT} || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 3s

  airflow-init:
    build:
      context: .
      dockerfile: ./Dockerfiles/Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
      data-loader:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POST_USER}:${POST_PASS}@postgres:${POST_PORT}/${POST_DB_AIRFLOW}
      TZ: America/Argentina/Buenos_Aires
      MLFLOW_S3_ENDPOINT_URL: http://minio:${MINIO_STORAGE_PORT}
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASS}
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /etc/localtime:/etc/localtime:ro
    entrypoint: /bin/bash
    command: >
      -c "
      airflow db init &&
      airflow users create --username ${AIRFLOW_USER} --firstname ${AIRFLOW_F_NAME} --lastname ${AIRFLOW_L_NAME} --role ${AIRFLOW_ROLE} --password ${AIRFLOW_PASS} --email ${AIRFLOW_EMAIL}
      "

  airflow-webserver:
    build:
      context: .
      dockerfile: ./Dockerfiles/Dockerfile.airflow
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POST_USER}:${POST_PASS}@postgres:${POST_PORT}/${POST_DB_AIRFLOW}
      TZ: America/Argentina/Buenos_Aires
      MLFLOW_S3_ENDPOINT_URL: http://minio:${MINIO_STORAGE_PORT}
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASS}
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${AIRFLOW_WEB_PORT}:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: ./Dockerfiles/Dockerfile.airflow
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POST_USER}:${POST_PASS}@postgres:${POST_PORT}/${POST_DB_AIRFLOW}
      TZ: America/Argentina/Buenos_Aires
      MLFLOW_S3_ENDPOINT_URL: http://minio:${MINIO_STORAGE_PORT}
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASS}
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /etc/localtime:/etc/localtime:ro
    command: scheduler

  mlflow_serve_model:
    build:
      context: .
      dockerfile: ./Dockerfiles/Dockerfile.mlflow_serve_model
    container_name: mlflow_serve_model
    restart: always
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT}
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASS}
      MLFLOW_S3_ENDPOINT_URL: http://minio:${MINIO_STORAGE_PORT}
      AWS_REGION: us-east-1
      REGISTERED_MODEL_NAME: EMNIST-Model
      MLFLOW_SERVE_MODEL_PORT: ${MLFLOW_SERVE_MODEL_PORT}
    depends_on:
      mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${MLFLOW_SERVE_MODEL_PORT}:1234"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://mlflow_serve_model:${MLFLOW_SERVE_MODEL_PORT} || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    
  draw_app:
    build:
      context: .
      dockerfile: ./Dockerfiles/Dockerfile.draw_app
    container_name: draw_app
    ports:
      - "${DRAW_APP_PORT}:8000"
    depends_on:
      mlflow_serve_model:
        condition: service_healthy
    environment:
      MODEL_URL: http://mlflow_serve_model:${MLFLOW_SERVE_MODEL_PORT}/invocations
